name: Postino indici PUN PSV
on:
  schedule:
    - cron: "17 6 2-10 * *"   # dal 2 al 10 di ogni mese, alle 7:17/8:17 ora italiana
  workflow_dispatch: {}        # pulsante "Run workflow" per lanciarlo a mano
permissions:
  contents: write
jobs:
  aggiorna:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installa il lettore Excel (per i file GME)
        run: pip install openpyxl
      - name: Scarica e controlla gli indici
        run: python aggiorna.py
      - name: Salva se ci sono mesi nuovi
        run: |
          if git diff --quiet indici.json; then echo "Niente di nuovo"; exit 0; fi
          git config user.name "postino-simulatore"
          git config user.email "postino@users.noreply.github.com"
          git add indici.json
          git commit -m "Indici aggiornati $(date +%Y-%m-%d)"
          git push
